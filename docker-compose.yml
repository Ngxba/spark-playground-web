include:
  - spark-cluster/docker-compose.yaml

services:
  postgres:
    image: postgres:15
    container_name: spark-playground-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spark_playground
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spark-playground-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: spark-playground-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/.env:/app/.env
      - ./backend/pyspark_jars:/opt/pyspark_jars
    environment:
      - PYTHONUNBUFFERED=1
      - SPARK_MASTER_URL=spark://spark-master:7077
      - PYSPARK_PYTHON=python3.12
      - PYSPARK_DRIVER_PYTHON=python3.12
      - PYSPARK_JARS_DIR=/opt/pyspark_jars
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    networks:
      - spark-playground-network

  frontend:
    build: ./frontend
    container_name: spark-playground-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - spark-playground-network

  minio:
    image: minio/minio:latest
    container_name: spark-playground-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - spark-playground-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  spark-playground-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: