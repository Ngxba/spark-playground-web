services:
  spark-history:
    build: ./spark-history
    container_name: spark-history-server
    ports:
      - "18080:18080"  # Spark History Server UI
    volumes:
      - spark-events:/tmp/spark-events
      - ./spark-history/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - spark-playground-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15
    container_name: spark_playground_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spark_playground
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spark-playground-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: spark-playground-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/.env:/app/.env
      - spark-events:/tmp/spark-events
    environment:
      - PYTHONUNBUFFERED=1
      - SPARK_EVENT_LOG_DIR=/tmp/spark-events
    depends_on:
      postgres:
        condition: service_healthy
      spark-history:
        condition: service_started
    networks:
      - spark-playground-network

  frontend:
    build: ./frontend
    container_name: spark-playground-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - spark-playground-network

networks:
  spark-playground-network:
    driver: bridge

volumes:
  spark-events:
  postgres_data:
